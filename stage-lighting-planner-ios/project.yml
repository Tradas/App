# XcodeGen: `brew install xcodegen && xcodegen generate` vytvoří StageLightingPlanner.xcodeproj
name: StageLightingPlanner
options:
  bundleIdPrefix: cz.example
  deploymentTarget:
    iOS: "17.0"
targets:
  StageLightingPlanner:
    type: application
    platform: iOS
    sources: [StageLightingPlanner]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Plánovač osvětlení"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: cz.example.StageLightingPlanner
